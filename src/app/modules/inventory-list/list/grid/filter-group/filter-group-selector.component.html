<div class="relative mr-1 flex flex-col">
  <mat-label class="text-secondary text-sm">Filter Group</mat-label>
  <div class="flex h-8 items-center gap-1">
    <mat-select
      class="bg-card h-6 w-50 self-start rounded border border-gray-500 p-3 text-sm"
      [(value)]="selectedFilterGroupId"
      (selectionChange)="onFilterGroupChange($event.value)"
      placeholder="None"
    >
      <mat-option class="text-sm" [value]="null">None</mat-option>
      @for (fg of filterGroups; track fg.id) {
        <mat-option class="text-sm" [value]="fg.id">{{ fg.name }}</mat-option>
      }
    </mat-select>

    @if (modified) {
      <span class="text-xs text-warn" matTooltip="Filters have been modified">●</span>
    }

    @if (isAliRoot) {
      <div class="flex items-center gap-2">
        <button
          class="!size-8 !min-w-0"
          [disabled]="!selectedFilterGroup || !modified"
          (click)="saveFilterGroup()"
          mat-icon-button
          matTooltip="Save"
        >
          <mat-icon class="scale-75 text-green-600" svgIcon="fa-solid:floppy-disk" />
        </button>
        <button
          class="!size-8 !min-w-0"
          [disabled]="!selectedFilterGroup"
          (click)="renameFilterGroup()"
          mat-icon-button
          matTooltip="Rename"
        >
          <mat-icon class="scale-75 fill-cyan-600" svgIcon="fa-solid:pencil" />
        </button>
        <button
          class="!size-8 !min-w-0"
          [disabled]="!selectedFilterGroup"
          (click)="deleteFilterGroup()"
          mat-icon-button
          matTooltip="Delete"
        >
          <mat-icon class="scale-75 text-red-500" svgIcon="fa-solid:trash" />
        </button>
        <button class="!size-8 !min-w-0" (click)="newFilterGroup()" mat-icon-button matTooltip="New Filter Group">
          <mat-icon class="scale-75 fill-primary-700" svgIcon="fa-solid:plus" />
        </button>
      </div>
    }

    <!-- Label toggle -->
    <button
      class="ml-1 flex h-8 items-center gap-1 rounded px-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-700"
      [attr.aria-expanded]="showLabelPanel"
      (click)="showLabelPanel = !showLabelPanel"
      type="button"
    >
      <mat-icon class="!text-blue-600 icon-size-5" [class.!text-blue-800]="hasLabelSelections" fontIcon="label" />
      <span>Filter by labels</span>
    </button>
  </div>

  <!-- Label filter panel (collapsible popover) -->
  @if (showLabelPanel && labels.length > 0) {
    <div class="absolute right-0 top-full z-10 mt-1 w-96 rounded border bg-white p-3 shadow-md dark:bg-gray-900" *transloco="let t">
      <div class="mb-2 flex items-center justify-between">
        <span class="text-sm font-semibold">Label Filters</span>
        <button class="!size-6 !min-w-0" [attr.aria-label]="t('Close')" (click)="showLabelPanel = false" mat-icon-button>
          <mat-icon class="icon-size-4" fontIcon="close" />
        </button>
      </div>
      <div class="grid grid-cols-[minmax(0,1fr)_5rem_5rem_5rem] gap-2 text-xs">
        <div></div>
        <div class="text-center font-semibold">AND</div>
        <div class="text-center font-semibold">OR</div>
        <div class="text-center font-semibold">Exclude</div>
      </div>
      <div class="max-h-48 overflow-y-auto">
        @for (label of labels; track label.id) {
          <div class="grid grid-cols-[minmax(0,1fr)_5rem_5rem_5rem] items-center gap-2 border-t py-1">
            <div class="flex items-center gap-1 text-xs">
              <span class="inline-block size-2.5 shrink-0 rounded-full" [style.background-color]="getLabelDotColor(label.color)"></span>
              <span class="truncate">{{ label.name }}</span>
            </div>
            <label class="flex cursor-pointer items-center justify-center text-xs">
              <input
                [attr.aria-label]="label.name + ' AND'"
                [checked]="isLabelSelected(label.id, 'and')"
                (change)="toggleLabel(label.id, 'and')"
                type="checkbox"
              />
            </label>
            <label class="flex cursor-pointer items-center justify-center text-xs">
              <input
                [attr.aria-label]="label.name + ' OR'"
                [checked]="isLabelSelected(label.id, 'or')"
                (change)="toggleLabel(label.id, 'or')"
                type="checkbox"
              />
            </label>
            <label class="flex cursor-pointer items-center justify-center text-xs">
              <input
                [attr.aria-label]="label.name + ' Exclude'"
                [checked]="isLabelSelected(label.id, 'exclude')"
                (change)="toggleLabel(label.id, 'exclude')"
                type="checkbox"
              />
            </label>
          </div>
        }
      </div>
    </div>
  }
</div>
