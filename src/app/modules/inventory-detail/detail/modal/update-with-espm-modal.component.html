<seed-modal-header [close]="close.bind(this)" title="Import from ESPM" titleIcon="fa-solid:arrow-up-from-bracket"></seed-modal-header>

<div class="flex flex-col gap-4">
  <!-- Column Mapping Profile — shared by both paths -->
  <mat-form-field class="w-full">
    <mat-label>Column Mapping Profile</mat-label>
    <mat-select [(ngModel)]="selectedProfileId" [disabled]="busy">
      @for (profile of profiles; track profile.id) {
        <mat-option [value]="profile.id">{{ profile.name }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  @if (errorMessage) {
    <seed-alert type="error">{{ errorMessage }}</seed-alert>
  }

  <div class="text-secondary text-sm">
    Use an ESPM-exported spreadsheet or connect directly to ESPM to update this property.
  </div>

  <!-- Path 1: Upload spreadsheet -->
  <div class="flex items-center gap-3">
    <input accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" type="file" (change)="onFileChange($event)" [disabled]="busy" />
    <button
      [disabled]="!xlsxFile || !selectedProfileId || busy"
      (click)="uploadFile()"
      mat-flat-button
      color="primary"
    >Upload ESPM Property</button>
  </div>

  <div class="my-1 flex items-center gap-3">
    <mat-divider class="flex-1"></mat-divider>
    <span class="text-secondary text-sm font-medium">OR</span>
    <mat-divider class="flex-1"></mat-divider>
  </div>

  <!-- Path 2: Direct ESPM credentials -->
  <mat-form-field class="w-full">
    <mat-label>ESPM Property ID</mat-label>
    <input matInput [(ngModel)]="pmPropertyId" [disabled]="busy" />
  </mat-form-field>

  <mat-form-field class="w-full">
    <mat-label>ESPM Username</mat-label>
    <input matInput [(ngModel)]="username" autocomplete="off" [disabled]="busy" />
  </mat-form-field>

  <mat-form-field class="w-full">
    <mat-label>ESPM Password</mat-label>
    <input matInput [(ngModel)]="password" [type]="showPassword ? 'text' : 'password'" autocomplete="new-password" [disabled]="busy" />
    <button mat-icon-button matSuffix type="button" (click)="showPassword = !showPassword">
      <mat-icon [svgIcon]="showPassword ? 'fa-solid:eye-slash' : 'fa-solid:eye'"></mat-icon>
    </button>
  </mat-form-field>

  <button
    [disabled]="!pmPropertyId || !username || !password || !selectedProfileId || busy"
    (click)="importFromEspm()"
    class="w-full"
    mat-flat-button
    color="primary"
  >{{ busy ? 'Importing…' : 'Import directly from ESPM' }}</button>
</div>

<div class="mt-4 flex justify-end">
  <button [disabled]="busy" (click)="close()" mat-stroked-button>Close</button>
</div>
